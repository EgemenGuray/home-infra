name: monitoring
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PROMETHEUS_VERSION: 3.5.0
  ALERTMANAGER_VERSION: 0.28.1
  LOKI_VERSION: 3.5.3
  ALLOY_VERSION: 1.10.0
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tools (same versions as the images in services/monitoring)
        run: |
          mkdir -p "$HOME/bin" && cd "$(mktemp -d)"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" | tar xz --strip-components=1
          curl -fsSL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" | tar xz --strip-components=1
          curl -fsSLO "https://github.com/grafana/loki/releases/download/v${LOKI_VERSION}/loki-linux-amd64.zip" && unzip -q loki-linux-amd64.zip
          curl -fsSLO "https://github.com/grafana/alloy/releases/download/v${ALLOY_VERSION}/alloy-linux-amd64.zip" && unzip -q alloy-linux-amd64.zip
          install promtool amtool "$HOME/bin/" && install loki-linux-amd64 "$HOME/bin/loki" && install alloy-linux-amd64 "$HOME/bin/alloy"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          pip install -q pytest pyyaml
      - run: tests/monitoring/run.sh

# Loki, single binary, filesystem storage. Runs on the Mac mini (Mac mini only setup) or on the
# Mac Studio (Mac mini + Mac Studio). Retention from LOKI_RETENTION (default 7 days on the mini;
# the Studio's .env can raise it to 30 days). Started with -config.expand-env=true.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring: {kvstore: {store: inmemory}}
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules-tmp

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}

limits_config:
  retention_period: ${LOKI_RETENTION:-168h}
  ingestion_rate_mb: 2
  ingestion_burst_size_mb: 4
  max_query_series: 2000
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 1h

query_range:
  results_cache:
    cache: {embedded_cache: {enabled: true, max_size_mb: 32}}

chunk_store_config:
  chunk_cache_config:
    embedded_cache: {enabled: true, max_size_mb: 32}

# Log-based alerts (loki/rules/fake/*.yml; "fake" is the tenant when auth is off) go to the
# Alertmanager on the Mac mini.
ruler:
  storage:
    type: local
    local: {directory: /etc/loki/rules}
  rule_path: /loki/rules-tmp
  alertmanager_url: ${ALERTMANAGER_URL}
  enable_api: true
  enable_alertmanager_v2: true
  evaluation_interval: 1m

analytics:
  reporting_enabled: false
